<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini E-commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",sans-serif}</style>
    <script>
        async function ping(){
            try{ const r = await fetch('/produtos'); const t = await r.text(); console.log(t); }catch(e){ console.error(e); }
        }
        window.addEventListener('load', ping);
    </script>
    </head>
<body class="min-h-screen bg-slate-50">
        <header class="bg-gradient-to-r from-slate-900 to-slate-700 text-white">
            <div class="max-w-5xl mx-auto px-4 py-8 flex items-center justify-between">
                <h1 class="text-3xl font-extrabold">Mini E-commerce</h1>
                <nav class="space-x-3">
                    <a href="/produtos" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/20 text-sm font-semibold">Produtos</a>
                    <a href="/carrinho" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/20 text-sm font-semibold">Carrinho</a>
                    <a href="/admin" class="px-3 py-2 rounded-md bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold">Admin</a>
            </nav>
        </div>
    </header>
        <main class="max-w-5xl mx-auto px-4 py-10">
            <section class="relative overflow-hidden rounded-2xl shadow bg-white">
                <div class="absolute inset-0 bg-gradient-to-br from-slate-50 to-white"></div>
                <div class="relative p-8">
                    <h2 class="text-2xl font-extrabold text-slate-900">Bem-vindo!</h2>
                    <p class="mt-2 text-slate-600">Navegue pelos produtos, adicione ao carrinho e finalize sua compra escolhendo o tipo de pagamento.</p>
                    <div class="mt-6 flex gap-3">
                        <a href="/produtos" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-md font-semibold">Ver produtos</a>
                        <a href="/carrinho" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-800 rounded-md font-semibold">Ver carrinho</a>
                    </div>
                </div>
            </section>
        </main>
    <footer class="text-center text-slate-500 text-sm py-6">IFPR - POO • Mini e-commerce</footer>
</body>
</html>
