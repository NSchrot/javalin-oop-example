<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50">
  <header class="bg-gradient-to-r from-slate-900 to-slate-700 text-white">
    <div class="max-w-5xl mx-auto px-4 py-8 flex items-center justify-between">
      <h1 class="text-3xl font-extrabold"><a href="/">Mini E-commerce</a></h1>
      <nav class="space-x-3">
        <a href="/produtos" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/20 text-sm font-semibold">Produtos</a>
        <a href="/carrinho" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/20 text-sm font-semibold">Carrinho</a>
        <a href="/admin" class="px-3 py-2 rounded-md bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold">Admin</a>
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-10 space-y-8">
    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold text-slate-800">Cadastrar Produto</h2>
      <form id="form-cadastro" class="mt-4 grid sm:grid-cols-3 gap-3">
        <input class="border rounded-md px-3 py-2" placeholder="Nome" name="nome" required />
        <input class="border rounded-md px-3 py-2" placeholder="Preço" name="preco" type="number" step="0.01" required />
        <input class="border rounded-md px-3 py-2" placeholder="Estoque" name="estoque" type="number" required />
        <button class="sm:col-span-3 px-4 py-2 bg-emerald-600 text-white rounded-md font-semibold">Cadastrar</button>
      </form>
      <pre id="saida-cadastro" class="mt-3 bg-slate-50 rounded p-3 text-slate-700"></pre>
    </section>

    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold text-slate-800">Remover Produto</h2>
      <form id="form-remover" class="mt-4 flex gap-3">
        <input class="border rounded-md px-3 py-2 flex-1" placeholder="Nome" name="nome" required />
        <button class="px-4 py-2 bg-red-600 text-white rounded-md font-semibold">Remover</button>
      </form>
      <pre id="saida-remover" class="mt-3 bg-slate-50 rounded p-3 text-slate-700"></pre>
    </section>

    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold text-slate-800">Catálogo</h2>
      <pre id="catalogo" class="mt-3 bg-slate-50 rounded p-3 text-slate-700"></pre>
      <div class="mt-2">
        <button id="atualizar" class="px-3 py-2 bg-slate-900 text-white rounded-md text-sm font-semibold">Atualizar</button>
      </div>
    </section>
  </main>
  <script>
    async function listar(){
      const r = await fetch('/api/produtos');
      const produtos = await r.json();
      const el = document.getElementById('catalogo');
      if(produtos.length === 0){
        el.innerHTML = '<span class="text-slate-500">Catálogo vazio</span>';
        return;
      }
      el.innerHTML = produtos.map(p => `
        <div class="mb-2 pb-2 border-b animate-fade-in">
          <span class="font-bold text-slate-900">${p.nome}</span>
          <span class="ml-2 text-emerald-700">R$ ${p.preco.toFixed(2)}</span>
          <span class="ml-2 text-slate-500 text-xs">Estoque: ${p.estoque}</span>
        </div>
      `).join('');
      
      const style = document.createElement('style');
      style.textContent = `@keyframes fade-in { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} } .animate-fade-in { animation: fade-in .5s cubic-bezier(.4,0,.2,1) both; }`;
      document.head.appendChild(style);
    }
    document.getElementById('atualizar').onclick = listar;

    document.getElementById('form-cadastro').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/></svg>Cadastrando...</span>';
      const fd = new FormData(e.target);
      const qs = new URLSearchParams(fd);
      try {
        const r = await fetch(`/admin/produtos?${qs}`, { method: 'POST' });
        const t = await r.text();
        showToast(t.includes('cadastrado') ? 'Produto cadastrado! 🎉' : t, t.includes('cadastrado') ? 'success' : 'error');
        document.getElementById('saida-cadastro').textContent = t;
      } catch(e){
        showToast('Erro de conexão','error');
      }
      btn.disabled = false;
      btn.innerHTML = 'Cadastrar';
      await listar();
    };
    document.getElementById('form-remover').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/></svg>Removendo...</span>';
      const fd = new FormData(e.target);
      const qs = new URLSearchParams(fd);
      try {
        const r = await fetch(`/admin/produtos?${qs}`, { method: 'DELETE' });
        const t = await r.text();
        showToast(t.includes('removido') ? 'Produto removido! 🗑️' : t, t.includes('removido') ? 'success' : 'error');
        document.getElementById('saida-remover').textContent = t;
      } catch(e){
        showToast('Erro de conexão','error');
      }
      btn.disabled = false;
      btn.innerHTML = 'Remover';
      await listar();
    };
    
    function showToast(msg, type='success'){
      let toast = document.createElement('div');
      toast.className = `fixed top-6 right-6 z-50 px-4 py-3 rounded-lg shadow-lg text-white font-semibold animate-fade-in ${type==='success'?'bg-emerald-600':'bg-red-600'}`;
      toast.innerHTML = `<span>${msg}</span>`;
      document.body.appendChild(toast);
      setTimeout(()=>{ toast.classList.add('opacity-0'); setTimeout(()=>toast.remove(),500); }, 2200);
    }

    listar();
  </script>
</body>
</html>
